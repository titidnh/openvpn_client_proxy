# ===========================================================================
# docker-compose.yml pour openvpn-client-proxy
# 
# Deux profils de configuration principaux :
#
#   1. PROFIL "DEFAULT" (STANDARD)
#      - OpenVPN sans features supplémentaires
#      - DNS en clair via dnsmasq
#      - Proxy HTTP simple (127.0.0.1:3128)
#      Cas d'usage: Configuration minimale, basse mémoire
#      Décommentez la section "# PROFIL: DEFAULT" ci-dessous
#
#   2. PROFIL "STRICT-FILTERING" (DoT + DNS Blocklist)
#      - OpenVPN + Proxy auth + DoT + DNS Blocklist
#      - Chiffrement DNS complet (DoT)
#      - Blocage des annonces/malware au niveau DNS
#      - Allowlist pour les faux positifs
#      Cas d'usage: Configuration de sécurité maximale
#      Décommentez la section "# PROFIL: STRICT-FILTERING" ci-dessous
#
#   Optionnel (les deux profils) : mesh VPN
#      - Tailscale (ENABLE_TAILSCALE=true) ou NetBird (ENABLE_NETBIRD=true)
#      - Démarré une fois le tunnel VPN opérationnel
#
# Auteur: Vibe Code (amélioration 2026)
# Licence: MIT
# Version: 3.0.0
# ===========================================================================

services:
  openvpn-proxy:
    build: .
    # image: titidnh/openvpn_client_proxy:latest
    container_name: openvpn-client-proxy
    restart: unless-stopped
    
    # ===================================================================
    # Hardening runtime (review sécurité 2026-10)
    # ===================================================================
    # Interdit à tout processus (même root) de regagner des privilèges
    # via setuid/setgid binaire.
    security_opt:
      - no-new-privileges:true
    
    # Réduction des capabilities Linux au strict nécessaire :
    #   NET_ADMIN        - routage, iptables (kill switch), création tun/wg
    #   NET_RAW          - sockets bruts (WireGuard, Tailscale, healthcheck)
    #   NET_BIND_SERVICE - dnsmasq écoute sur le port 53 (< 1024)
    #   SETUID/SETGID    - openvpn/privoxy/dnsmasq abandonnent leurs
    #                      privilèges après démarrage (--user/--group)
    #   CHOWN/DAC_OVERRIDE/FOWNER - chown/sed -i sur /etc (privoxy, unbound)
    #   KILL             - le superviseur tue privoxy (uid vpn) / tinyproxy
    # Toutes les autres capabilities par défaut (MKNOD, SETPCAP, SYS_CHROOT,
    # AUDIT_WRITE, SETFCAP, FSETID, ...) sont supprimées.
    # NOTE : smoke-testez (make up + healthcheck) si vous ajoutez une
    # feature qui échoue faute de capability, avant d'élargir cette liste.
    # NetBird (ENABLE_NETBIRD=true) recommande en plus SYS_ADMIN et
    # SYS_RESOURCE (eBPF / raw sockets) - voir README "NetBird".
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
    
    # Anti fork-bomb / dérive du nombre de processus :
    # la limite pids est définie dans deploy.resources.limits.pids ci-dessous.
    # NOTE : ne PAS utiliser pids_limit au niveau service en plus d'un bloc
    # deploy.resources.limits - Compose >= v5 normalise pids_limit vers
    # deploy.resources.limits.pids et refuse alors le projet avec
    # "can't set distinct values on 'pids_limit' and
    # 'deploy.resources.limits.pids': invalid compose project".
    
    # Périphériques requis pour OpenVPN/WireGuard
    devices:
      - /dev/net/tun
    
    # Paramètres système
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      # Décommentez si TAILSCALE_ADVERTISE_EXIT_NODE=true ou si ce peer
      # NetBird sert de routing peer (routes NetBird via le tunnel) :
      # - net.ipv4.ip_forward=1
      # - net.ipv6.conf.all.forwarding=1
    
    # Limites de ressources
    deploy:
      resources:
        limits:
          # Profil DEFAULT: 128M
          # Profil STRICT-FILTERING: 192M+ (compilation de listes + auth)
          memory: 128M
          # Anti fork-bomb / dérive du nombre de processus (hardening H2)
          pids: 256
    
    # Volumes
    volumes:
      # Répertoire VPN avec vpn.conf et vpn.auth
      - ./vpn:/vpn:ro
      # Données persistantes Tailscale
      - tailscale-data:/var/lib/tailscale
      # Données persistantes NetBird (identité du peer)
      - netbird-data:/var/lib/netbird
      # Cache des listes de blocage (optionnel)
      - blocklist-cache:/tmp
      # D2 : ancre racine DNSSEC (root.key) et etat RFC 5011 persistants -
      # sans volume, chaque recreation de conteneur repart de zero.
      - unbound-anchor:/var/lib/unbound
      # Pinning de certificat DoT (optionnel, décommentez si utilisé)
      # - ./my-dot-ca.pem:/vpn/dot-ca.pem:ro
    
    # Ports exposés
    ports:
      # Proxy HTTP: défaut 127.0.0.1:3128 (localhost only)
      # Changez à "3128:3128" pour accès externe (avec auth recommandé)
      - "127.0.0.1:3128:3128"
      
      # Métriques Prometheus - JAMAIS lier à 0.0.0.0
      # Accès via: docker exec openvpn-proxy curl http://127.0.0.1:9100/metrics
      # - "127.0.0.1:9100:9100"
    
    environment:
      # =================================================================
      # PROFIL: DEFAULT (STANDARD - Décommentez cette section)
      # =================================================================
      # DNS en clair via dnsmasq (pas de chiffrement)
      ENABLE_DOT: "false"
      DNS_SERVER_1: "94.140.14.14"      # AdGuard Default (ads only)
      DNS_SERVER_2: "94.140.15.15"

      # Bypass VPN pour DNS locaux : "false" (défaut) = tout le DNS passe par
      # le tunnel VPN (recommandé avec un DNS public). "true" = les serveurs
      # DNS (DNS_SERVER_1/2 en mode classique, serveurs DoT/DoH en mode DoT)
      # sont joints via le réseau local (eth0) au lieu du tunnel - à réserver
      # à un résolveur LOCAL (DNS de la box, Pi-hole du LAN).
      DNS_BYPASS_VPN: "false"
      
      # DNS Blocklist désactivée
      ENABLE_DNS_BLOCKLIST: "false"
      
      # Pas d'authentification proxy
      PROXY_USER: ""
      PROXY_PASS: ""
      
      # Features optionnelles
      ENABLE_METRICS: "false"
      ENABLE_TAILSCALE: "false"
      ENABLE_NETBIRD: "false"
      ENABLE_DNSSEC: "false"

      # Re-résolution périodique des remotes VPN (dette "IP figées")
      # 3600 = toutes les heures ; 0 = désactiver
      VPN_REMOTE_REFRESH_INTERVAL: "3600"

      # =================================================================
      # PROFIL: STRICT-FILTERING (DoT + DNS Blocklist)
      # Décommentez les lignes ci-dessous et commentez le profil DEFAULT
      # =================================================================
      # DNS-over-TLS avec chiffrement complet
      # ENABLE_DOT: "true"
      # DOT_DNS_SERVERS: "tls://dns.adguard-dns.com"
      # DOT_IP_REFRESH_INTERVAL: "3600"       # Refresh DoT IPs toutes les heures
      # ENABLE_DNSSEC: "false"                # Set to true si tous les upstreams supportent DNSSEC
      # DNS_BYPASS_VPN s'applique aussi en DoT : "true" joint les serveurs
      # DoT/DoH (853/443) via le réseau local - uniquement pour un DoT local.
      
      # DNS Blocklist (ad-blocking au niveau DNS)
      # ENABLE_DNS_BLOCKLIST: "true"
      # DNS_BLOCKLIST_URLS: >
      #   https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
      #   https://adaway.org/hosts.txt
      # DNS_BLOCKLIST_REFRESH_INTERVAL: "86400"   # Refresh quotidien
      # DNS_BLOCKLIST_MIN_AGE: "3600"             # Cache TTL: 1 heure
      # DNS_BLOCKLIST_ALLOWLIST: "trusted.local,example.com"
      
      # Authentification proxy HTTP Basic
      # PROXY_USER: "alice"
      # PROXY_PASS: "Passw0rd"   # [A-Za-z0-9._-] uniquement (limite tinyproxy BasicAuth)
      
      # Sécurité renforcée
      # ENABLE_METRICS: "true"                 # Prometheus metrics
      # Capabilities : DROP_CAPS est obsolete (sans effet). La réduction
      # cap_drop/cap_add est désormais appliquée par défaut ci-dessus
      # (review sécurité 2026-10).
      
      # Tailscale (optionnel)
      # ENABLE_TAILSCALE: "false"
      # =================================================================

      # =================================================================
      # NetBird (optionnel - mesh VPN alternatif à Tailscale)
      # La setup key est passée au client par son environnement
      # (NB_SETUP_KEY), jamais sur la ligne de commande.
      # Le nom du peer vient du hostname du conteneur (voir "hostname:"
      # du service dans la doc NetBird).
      # =================================================================
      # ENABLE_NETBIRD: "true"
      # NETBIRD_SETUP_KEY: "AABBCCDDEEFF-0123456789"
      # NetBird auto-hébergé uniquement (défaut cloud : https://api.netbird.io:443):
      # NETBIRD_MANAGEMENT_URL: "https://netbird.exemple.com:443"
      # NETBIRD_FLAGS: ""                 # Flags supplémentaires pour "netbird up"
      # NETBIRD_DATA_DIR: "/var/lib/netbird"
      # =================================================================

      # Paramètres communs aux deux profils
      PROXY_PORT: "3128"
      # Review sécurité 2026-10 : abandon des privilèges du processus openvpn
      # après la création du tun (--user vpn --group vpn dans openvpn.sh).
      # "false" pour désactiver (ex: config VPN avec scripts up/down
      # nécessitant root, ou comportement historique).
      OPENVPN_DROP_PRIVILEGES: "true"
      # "true" exige PROXY_USER/PROXY_PASS (le conteneur refuse sinon de
      # demarrer). Derogation explicite pour un proxy ouvert sans auth :
      # ALLOW_UNAUTHENTICATED_EXTERNAL_PROXY: "true"
      ALLOW_EXTERNAL_PROXY_ACCESS: "false"
      # Bypass explicite du garde-fou ci-dessus (proxy OUVERT sans authent).
      # Decommenter uniquement en connaissance de cause.
      # ALLOW_UNAUTHENTICATED_EXTERNAL_PROXY: "false"
      # "true" = le proxy peut joindre LAN / hote Docker / tailnet (bloque par defaut)
      PROXY_ALLOW_PRIVATE_NETWORKS: "false"
      HEALTHCHECK_IP: "9.9.9.9"
      ROUTE_TEST_IP: "9.9.9.9"
      PROXY_TEST_HOST: "connectivitycheck.gstatic.com"
      PROXY_TEST_URL: "http://connectivitycheck.gstatic.com/generate_204"
      SKIP_HEALTHCHECK_FIRST_MINUTES: "2"
      TAILSCALE_RUN_DIR: "/var/lib/tailscale"
      TAILSCALE_HOSTNAME: "openvpn-proxy"
      TAILSCALE_ACCEPT_ROUTES: "false"
      TAILSCALE_ADVERTISE_EXIT_NODE: "false"
      TAILSCALE_FLAGS: ""

# Volumes pour les données persistantes
volumes:
  tailscale-data:
    # Permet de persister l'identité Tailscale entre les recreations de conteneur
  netbird-data:
    # Permet de persister l'identité NetBird entre les recreations de conteneur
  blocklist-cache:
    # Cache des listes de blocage compilées (optionnel)
  unbound-anchor:
    # Ancre racine DNSSEC (root.key) et état RFC 5011 - persiste entre les recreations
