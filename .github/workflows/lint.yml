name: Shell lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: shfmt + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck wget
          # Install shfmt (mvdan/sh) latest known release
          SHFMT_VER="v3.7.1"
          wget -qO /usr/local/bin/shfmt https://github.com/mvdan/sh/releases/download/${SHFMT_VER}/shfmt_${SHFMT_VER}_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: shfmt check (list files needing formatting)
        run: |
          echo "=== Checking shell script formatting ==="
          FILES_NEED_FORMAT=$(shfmt -l . 2>/dev/null || echo "")
          
          if [ -n "$FILES_NEED_FORMAT" ]; then
            echo "❌ The following files need formatting:"
            echo "$FILES_NEED_FORMAT"
            exit 1
          fi
          
          echo "✅ All files are properly formatted"

      - name: shellcheck
        run: |
          echo "=== Running ShellCheck ==="
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -x || exit 1
          echo "✅ ShellCheck passed"
