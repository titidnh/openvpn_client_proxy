name: CI - Lint & Tests

on:
  push:
    branches: [ main, features/**, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  shellcheck:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      
      - name: Run ShellCheck on all shell scripts
        run: |
          echo "=== Running ShellCheck ==="
          find . -type f -name "*.sh" -not -path "./.git/*" | sort | while read -r f; do
            echo "Linting: $f"
            shellcheck -x "$f" || exit 1
          done
          echo "✅ ShellCheck passed all checks"

  shfmt:
    name: shfmt Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install shfmt
        run: |
          sudo apt-get update
          # Install shfmt via download (reliable method)
          SHFMT_VER="v3.7.1"
          wget -qO /tmp/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VER}/shfmt_${SHFMT_VER}_linux_amd64"
          sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version
      
      - name: Check shell script formatting
        run: |
          echo "=== Checking shell script formatting ==="
          find . -type f -name "*.sh" -not -path "./.git/*" | sort | while read -r f; do
            echo "Checking format: $f"
            if ! shfmt -d "$f"; then
              echo "❌ $f needs formatting"
              exit 1
            fi
          done
          echo "✅ All files are properly formatted"

  bats-tests:
    name: BATS Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install BATS
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      
      - name: Run BATS tests
        if: hashFiles('tests/*.bats') != ''
        run: |
          echo "=== Running BATS Unit Tests ==="
          bats tests/*.bats --trace 2>&1 | tee test-results.txt
          echo "✅ BATS tests completed"
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-results
          path: test-results.txt
          retention-days: 30

  lint-summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs: [ shellcheck, shfmt, bats-tests ]
    if: always()
    steps:
      - name: Check all lint results
        run: |
          echo "=== CI Lint & Test Summary ==="
          echo "ShellCheck: ${{ needs.shellcheck.result }}"
          echo "shfmt: ${{ needs.shfmt.result }}"
          echo "BATS Tests: ${{ needs.bats-tests.result }}"
          echo ""
          
          # Fail if any critical check failed
          if [ "${{ needs.shellcheck.result }}" = "failure" ]; then
            echo "❌ ShellCheck found issues"
            exit 1
          fi
          
          if [ "${{ needs.shfmt.result }}" = "failure" ]; then
            echo "❌ shfmt found formatting issues"
            exit 1
          fi
          
          if [ "${{ needs.bats-tests.result }}" = "failure" ]; then
            echo "❌ BATS tests failed"
            exit 1
          fi
          
          echo "✅ All lint and test checks passed!"
