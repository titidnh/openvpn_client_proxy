name: CI - Lint & Tests

on:
  push:
    branches: [ main, features/**, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  shellcheck:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      
      - name: Run ShellCheck on all shell scripts
        run: |
          # Run ShellCheck on all .sh files
          find . -type f -name "*.sh" -not -path "./.git/*" | while read f; do
            echo "Checking $f..."
            shellcheck "$f"
          done
          
          # Also check scripts without .sh extension if they have shell shebang
          find . -type f ! -name "*.sh" -not -path "./.git/*" | while read f; do
            if head -1 "$f" | grep -q "^#!/.*sh"; then
              echo "Checking $f..."
              shellcheck "$f"
            fi
          done

  shfmt:
    name: shfmt Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y golang-golang-x-tools
          GO111MODULE=on go get mvdan.cc/sh/v3/cmd/shfmt
          # Add to PATH
          export PATH="$PATH:$(go env GOPATH)/bin"
      
      - name: Check shell script formatting
        run: |
          # Check if shfmt is available, skip if not installed
          if ! command -v shfmt &> /dev/null; then
            echo "shfmt not available, installing via package..."
            sudo snap install shfmt 2>/dev/null || sudo apt-get install -y shfmt || echo "shfmt installation failed"
          fi
          
          if command -v shfmt &> /dev/null; then
            find . -type f -name "*.sh" -not -path "./.git/*" | while read f; do
              echo "Formatting check: $f"
              shfmt -d "$f" || true  # Don't fail on formatting differences yet (warning only)
            done
          else
            echo "shfmt not available - skipping format check"
          fi

  bats-tests:
    name: BATS Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install BATS
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      
      - name: Run BATS tests
        if: hashFiles('tests/*.bats') != ''  # Only if test files exist
        run: |
          # Run all bats test files
          bats tests/*.bats --trace
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-results
          path: test-results.txt
          retention-days: 30

  lint-summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs: [ shellcheck, shfmt, bats-tests ]
    if: always()
    steps:
      - name: Check lint results
        run: |
          echo "ShellCheck: ${{ needs.shellcheck.result }}"
          echo "shfmt: ${{ needs.shfmt.result }}"
          echo "BATS Tests: ${{ needs.bats-tests.result }}"
          
          # Fail if any strict checks failed
          if [ "${{ needs.shellcheck.result }}" = "failure" ]; then
            echo "❌ ShellCheck found issues"
            exit 1
          fi
          
          echo "✅ Lint checks passed"
