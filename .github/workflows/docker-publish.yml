name: Build and Publish Docker image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN (Docker Hub uses its own secrets).
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats

      - name: Bash syntax check
        run: |
          for f in $(git ls-files '*.sh'); do
            bash -n "$f"
          done

      - name: ShellCheck (errors only)
        run: shellcheck -S error $(git ls-files '*.sh') tests/security_regression.bats

      - name: OpenVPN remote parser tests
        run: CODE="$GITHUB_WORKSPACE" bash tests/parse_tests.sh

      - name: Security regression tests
        run: bats tests/security_regression.bats

      # Legacy bats suite: repaired in October 2026 (docs/SECURITY_REVIEW.md,
      # backlog Q1) and now blocking, like the rest of the checks.
      - name: Legacy bats suite
        run: bats tests/common.bats tests/dns_blocklist.bats tests/dns_runtime.bats tests/dot.bats tests/firewall.bats

  build-and-push:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: titidnh/openvpn_client_proxy
          tags: |
            # Push tag v1.2.3 → image tags: 1.2.3 + 1.2 + 1 + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Push on main → image tag: latest
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Review sécurité 2026-10 : scan de vulnérabilités de l image publiée.
      # Informationnel pour l instant (exit-code 0) : passer en bloquant
      # (exit-code 1) une fois la baseline établie (voir docs/SECURITY_REVIEW.md §4.3).
      - name: Trivy vulnerability scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
