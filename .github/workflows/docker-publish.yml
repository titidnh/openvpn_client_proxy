name: Build and Publish Docker image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN (Docker Hub uses its own secrets).
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats

      - name: Bash syntax check
        run: |
          for f in $(git ls-files '*.sh'); do
            bash -n "$f"
          done

      - name: ShellCheck (errors only)
        run: shellcheck -S error $(git ls-files '*.sh') tests/security_regression.bats

      - name: OpenVPN remote parser tests
        run: CODE="$GITHUB_WORKSPACE" bash tests/parse_tests.sh

      - name: Security regression tests
        run: bats tests/security_regression.bats

      # Legacy bats suite: repaired in October 2026 (docs/SECURITY_REVIEW.md,
      # backlog Q1) and now blocking, like the rest of the checks.
      # tests/dns_from_vpn.bats (PR #24) had been left out of this list;
      # tests/openvpn.bats guards the openvpn.sh launch regression fixed
      # alongside it (orphan fragments after the DNS_FROM_VPN block).
      - name: Legacy bats suite
        run: bats tests/common.bats tests/dns_blocklist.bats tests/dns_from_vpn.bats tests/dns_runtime.bats tests/dot.bats tests/firewall.bats tests/openvpn.bats

  build-and-push:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet : la version CHANGELOG est comparee au
          # dernier tag ANTERIEUR au push (git tag --merged HEAD~1).
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Version depuis le CHANGELOG (source de verite, Keep a Changelog).
      # Sur le push qui introduit une nouvelle version publiee, les tags
      # d'image versionnes sont emis dans le meta ci-dessous : un tag git
      # cree par le GITHUB_TOKEN de release.yml ne re-declenche pas les
      # workflows GitHub (regle anti-recursion), le type=semver ne suffit
      # donc que pour les tags pousses manuellement.
      - name: Extract version from CHANGELOG
        id: ver
        run: |
          VERSION="$(grep -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1)"
          if [ -z "$VERSION" ]; then
            echo "Aucune section ## [X.Y.Z] dans CHANGELOG.md" >&2
            exit 1
          fi
          MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1-2)"
          MAJOR="$(echo "$VERSION" | cut -d. -f1)"
          # Dernier tag ANTERIEUR au push : les tags crees apres (par
          # release.yml, qui pointent sur HEAD) sont exclus par --merged
          # HEAD~1 - pas de course critique avec le workflow de release.
          LATEST_TAGGED="$(git tag -l 'v*' --merged HEAD~1 2>/dev/null | sort -V | tail -1)"
          LATEST_VER="${LATEST_TAGGED#v}"
          IS_RELEASE="false"
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "$LATEST_VER" != "$VERSION" ]; then
            IS_RELEASE="true"
            echo "Release build : v$VERSION est une nouvelle version -> tags d'image versionnes"
          else
            echo "Build normal (changelog=$VERSION, dernier tag=v${LATEST_VER:-aucun}) -> seul 'latest' bouge"
          fi
          {
            echo "version=$VERSION"
            echo "major_minor=$MAJOR_MINOR"
            echo "major=$MAJOR"
            echo "is_release=$IS_RELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: titidnh/openvpn_client_proxy
          tags: |
            # Push tag v1.2.3 → image tags: 1.2.3 + 1.2 + 1 + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Push on main → image tag: latest
            type=raw,value=latest,enable={{is_default_branch}}
            # Release build (push sur main qui introduit une nouvelle
            # version dans le CHANGELOG, avant creation du tag) -> memes
            # tags d'image versionnes qu'un push de tag manuel.
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.ver.outputs.major_minor }},enable=${{ steps.ver.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.ver.outputs.major }},enable=${{ steps.ver.outputs.is_release == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Review sécurité 2026-10 : scan de vulnérabilités de l image publiée.
      # Informationnel pour l instant (exit-code 0) : passer en bloquant
      # (exit-code 1) une fois la baseline établie (voir docs/SECURITY_REVIEW.md §4.3).
      - name: Trivy vulnerability scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
