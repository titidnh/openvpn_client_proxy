name: Build and Publish Docker image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN (Docker Hub uses its own secrets).
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats

      - name: Bash syntax check
        run: |
          for f in $(git ls-files '*.sh'); do
            bash -n "$f"
          done

      - name: ShellCheck (errors only)
        run: shellcheck -S error $(git ls-files '*.sh') tests/security_regression.bats

      - name: OpenVPN remote parser tests
        run: CODE="$GITHUB_WORKSPACE" bash parse_tests.sh

      - name: Security regression tests
        run: bats tests/security_regression.bats
      - name: Camouflage mode tests
        run: bats tests/camouflage.bats

      # The older bats files contain known-broken tests (see SECURITY_REVIEW.md, Q1).
      # They run for visibility but do not block publishing until they are fixed.
      - name: Legacy bats suite (non-blocking)
        continue-on-error: true
        run: bats tests/common.bats tests/dns_blocklist.bats tests/dns_runtime.bats tests/dot.bats tests/firewall.bats

  build-and-push:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: titidnh/openvpn_client_proxy
          tags: |
            # Push tag v1.2.3 → image tags: 1.2.3 + 1.2 + 1 + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Push on main → image tag: latest
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
